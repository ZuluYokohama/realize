<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>realize — an independent inspector for answers from AI</title>
    <meta
      name="description"
      content="Your model can propose a solution. realize stamps whether that solution actually holds — and when it cannot tell, it says so."
    />
    <link rel="stylesheet" href="./css/theatre.css" />
  </head>
  <body>
    <noscript>
      <div id="app">
        <p class="claim">An independent inspector for answers from AI.</p>
        <section class="nonclaims">
          <h2>What this is not</h2>
          <ol>
            <li>It does not understand arbitrary English.</li>
            <li>It does not let the AI grade itself.</li>
            <li>This page cannot certify. Run realize check on your machine.</li>
          </ol>
        </section>
        <div class="install">
          <pre>pip install realize
realize demo three_state</pre>
        </div>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="./js/router.js"></script>
  </body>
</html>
